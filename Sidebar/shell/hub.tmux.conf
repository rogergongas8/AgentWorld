# AgentWorld hub — the tmux server behind `agentworld` (tmux -L agentworld).
# Its own server, so none of this touches your other tmux sessions.
# Installed to ~/.config/agentworld/hub.tmux.conf by scripts/install.sh.

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"
set -g escape-time 10
set -g focus-events on
set -g extended-keys on
set -g history-limit 50000
set -g mouse on
set -g base-index 0
set -g renumber-windows on
set -g allow-rename off
set -g set-titles on
set -g set-titles-string "AgentWorld · #W"

# The top bar, always visible:  ◆ AgentWorld  [ Agent | Code ]  1 Claude · repo  2 …  ＋ new
# Agent / Code switch the hub (window 0) to that mode; the numbered tabs are
# your terminals; everything is clickable. @aw_tab is kept up to date by the
# hub so the current mode stays highlighted.
set -g status on
set -g status-position top
set -g status-interval 2
set -g status-style "bg=#161a1f,fg=#8b949e"
set -g status-left-length 60
set -g status-left "#[fg=#d97757,bold] ◆ AgentWorld  #[range=user|agent]#{?#{&&:#{==:#{window_index},0},#{==:#{@aw_tab},agents}},#[bg=#3b4048#,fg=#f0e6d2#,bold],#[bg=#161a1f#,fg=#8b949e#,nobold]}  Agent  #[norange]#[bg=#161a1f,fg=#3b4048]│#[range=user|code]#{?#{&&:#{==:#{window_index},0},#{!=:#{@aw_tab},agents}},#[bg=#3b4048#,fg=#f0e6d2#,bold],#[bg=#161a1f#,fg=#8b949e#,nobold]}  Code  #[norange]#[bg=#161a1f,fg=#3b4048,nobold]  │ "
set -g status-right-length 60
set -g status-right "#[range=user|new,fg=#d97757]＋ new #[norange,fg=#5c6370] · ^b a agent · ^b c code "
set -g window-status-separator ""
# Window 0 is the hub itself: it's the Agent/Code tabs, not a terminal tab.
set -g window-status-format "#{?#{==:#I,0},,#[fg=#8b949e] #I #W }"
set -g window-status-current-format "#{?#{==:#I,0},,#[bg=#2a3039,fg=#f0e6d2,bold] #I #W }"
set -g window-status-activity-style "fg=#56d364"
set -g monitor-activity on
set -g visual-activity off

bind -n MouseDown1Status if -F '#{==:#{mouse_status_range},agent}' { select-window -t :0 ; send-keys -t :0.0 A } { if -F '#{==:#{mouse_status_range},code}' { select-window -t :0 ; send-keys -t :0.0 C } { if -F '#{==:#{mouse_status_range},new}' { select-window -t :0 ; send-keys -t :0.0 C } { select-window -t = } } }

set -g pane-border-style "fg=#30363d"
set -g pane-active-border-style "fg=#d97757"
set -g pane-border-lines single

# A title bar on every pane: ● when focused, the CLI's name, then whatever
# the program sets as its title (Claude Code shows its current task there).
set -g pane-border-status top
set -g pane-border-format "#{?pane_active,#[fg=#56d364]●,#[fg=#5c6370]○} #[fg=#f0e6d2,bold]#{?#{@aw_label},#{@aw_label},#{pane_current_command}}#[nobold,fg=#5c6370]#{?#{&&:#{@aw_label},#{!=:#{pane_title},#{host}}}, · #{=40:pane_title},} "

# prefix + a / c: the Agent / Code screens; prefix + h: back to the hub.
# prefix + n / p still cycle terminals.
bind a { select-window -t :0 ; send-keys -t :0.0 A }
bind c { select-window -t :0 ; send-keys -t :0.0 C }
bind h select-window -t :0
